name: GoreeCloud Care Development

on:
  pull_request:
    paths:
      - 'apps/goreecloud-care/**'
      - '.github/workflows/care-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/goreecloud-care/**'
      - '.github/workflows/care-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/goreecloud-care
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'Expected source revision: %s\nActual source revision:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install native GTK and accessibility test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-gtk-3.0 gir1.2-atk-1.0 xvfb \
            at-spi2-core python3-pyatspi dbus-x11

      - name: Validate Care source
        run: sh ./scripts/validate.sh

      - name: Run headless GTK runtime acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 python3 tests/runtime_ui_acceptance.py

      - name: Run live AT-SPI dynamic status acceptance
        run: |
          dbus-run-session -- xvfb-run -a bash -euc '
            export NO_AT_BRIDGE=0
            export GDK_DPI_SCALE=2
            export GSETTINGS_BACKEND=memory
            gsettings set org.gnome.desktop.interface toolkit-accessibility true
            python3 -m goreecloud_care >/tmp/goreecloud-care-atspi.log 2>&1 &
            care_pid=$!
            cleanup() {
              kill "$care_pid" 2>/dev/null || true
              wait "$care_pid" 2>/dev/null || true
            }
            trap cleanup EXIT INT TERM
            sleep 1
            if ! python3 tests/atspi_runtime_acceptance.py; then
              cat /tmp/goreecloud-care-atspi.log >&2 || true
              exit 1
            fi
          '

      - name: Run live Maintenance Insights AT-SPI acceptance
        run: |
          dbus-run-session -- xvfb-run -a bash -euc '
            export NO_AT_BRIDGE=0
            export GDK_DPI_SCALE=2
            export GSETTINGS_BACKEND=memory
            gsettings set org.gnome.desktop.interface toolkit-accessibility true
            python3 -m goreecloud_care --insights-ui >/tmp/goreecloud-care-insights-atspi.log 2>&1 &
            insights_pid=$!
            cleanup() {
              kill "$insights_pid" 2>/dev/null || true
              wait "$insights_pid" 2>/dev/null || true
            }
            trap cleanup EXIT INT TERM
            sleep 1
            if ! python3 tests/atspi_insights_runtime_acceptance.py; then
              cat /tmp/goreecloud-care-insights-atspi.log >&2 || true
              exit 1
            fi
          '

      - name: Run Dark HeaderBar runtime contrast acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 GOREECLOUD_CARE_APPEARANCE=dark python3 tests/runtime_ui_acceptance.py

      - name: Run Deep Dark HeaderBar runtime contrast acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 GOREECLOUD_CARE_APPEARANCE=deep-dark python3 tests/runtime_ui_acceptance.py

      - name: Run Clear clarity runtime acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 GOREECLOUD_CARE_GLAZE_CLARITY=clear python3 tests/runtime_ui_acceptance.py

      - name: Run Balanced clarity runtime acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 GOREECLOUD_CARE_GLAZE_CLARITY=balanced python3 tests/runtime_ui_acceptance.py

      - name: Run Dense clarity runtime acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 GOREECLOUD_CARE_GLAZE_CLARITY=dense python3 tests/runtime_ui_acceptance.py

      - name: Run Reduced Motion runtime acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 GOREECLOUD_CARE_REDUCE_MOTION=1 python3 tests/runtime_ui_acceptance.py

      - name: Build Development Debian package
        run: sh ./scripts/build-deb.sh dist

      - name: Inspect Development Debian package
        run: |
          dpkg-deb -I dist/goreecloud-care_0.1.0~dev22_all.deb
          dpkg-deb -c dist/goreecloud-care_0.1.0~dev22_all.deb

      - name: Record Development package provenance
        run: |
          cd dist
          sha256sum goreecloud-care_0.1.0~dev22_all.deb | tee SHA256SUMS
          printf 'source_revision=%s\nworkflow_run_id=%s\n' \
            '${{ github.event.pull_request.head.sha || github.sha }}' \
            '${{ github.run_id }}' \
            > SOURCE_REVISION
          cat SOURCE_REVISION

      - name: Preserve Development package evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-care-dev22-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/goreecloud-care/dist/goreecloud-care_0.1.0~dev22_all.deb
            apps/goreecloud-care/dist/SHA256SUMS
            apps/goreecloud-care/dist/SOURCE_REVISION
          if-no-files-found: error
          retention-days: 14
