name: GoreeCloud Care Development

on:
  pull_request:
    paths:
      - 'apps/goreecloud-care/**'
      - '.github/workflows/care-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/goreecloud-care/**'
      - '.github/workflows/care-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/goreecloud-care
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-atk-1.0 xvfb

      - name: Validate Care source
        run: sh ./scripts/validate.sh

      - name: Run headless GTK runtime acceptance
        run: xvfb-run -a env GDK_DPI_SCALE=2 python3 tests/runtime_ui_acceptance.py

      - name: Build Development Debian package
        run: sh ./scripts/build-deb.sh dist

      - name: Inspect Development Debian package
        run: |
          dpkg-deb -I dist/goreecloud-care_0.1.0~dev18_all.deb
          dpkg-deb -c dist/goreecloud-care_0.1.0~dev18_all.deb
