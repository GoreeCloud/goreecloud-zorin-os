conformance:
  status: nonconformant
  validated_at: null
  evidence: []
  blockers:
    - Exact Release Candidate CI package/checksum/reproducibility and representative Zorin OS 17.3 package lifecycle/installed-boundary evidence must be produced for this source revision before governed RC promotion is complete.
    - Privacy Shield predecessor runtime acceptance does not transfer to the Release Candidate; exact RC runtime acceptance must be refreshed and production_approved remains false for Stable/production.
    - Wardveil predecessor target evidence does not transfer to the Release Candidate; immutable RC regression evidence and governed Wardveil adoption/promotion remain required, and no Protected by Wardveil claim is authorized.
    - Everkeep predecessor readiness does not transfer to the Release Candidate; fresh exact RC target-runtime governance and local ready / everkeep-promoted verification remain required.
    - GLAZE UI V1.2 remains the official Stable compatibility baseline and product accepted-v1/production acceptance is incomplete; V1.3 Adaptive Resonance remains Proposed and consumer-ineligible.
    - Human-only final Orca spoken-announcement quality, compositor/native-window-control/icon optical review, applicable PolicyKit-agent UX, and remaining visual/usability/manual accessibility review remain explicit and unpassed; lifecycle v0.4 permits these to remain pending at RC but Stable still requires every applicable gate.
    - Release Candidate release evidence is intentionally absent until exact-head CI, deterministic package identity, representative target acceptance, and the applicable non-human governance sequence complete.
