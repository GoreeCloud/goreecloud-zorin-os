schema_version: "0.2"

component:
  type: application
  id: goreecloud-care
  product_name: GoreeCloud Care
  repository: GoreeCloud/goreecloud-zorin-os

lifecycle: development
version: 0.1.0-dev12

supported_platforms:
  - linux

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Operational visibility requirements have not yet been integrated or accepted.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - PRIVACY.md
    notes: Local-only privacy design is documented; formal Privacy Shield acceptance is not claimed.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
    notes: Least-privilege source controls are present; formal Wardveil Security acceptance is not claimed.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - RECOVERY.md
    notes: Recovery behavior is documented; Everkeep recovery acceptance has not been completed.
  glaze_ui:
    result: applicable-blocked
    version: "1.1.0"
    evidence:
      - tests/test_ui_contract.py
      - tests/test_focus_resilience.py
      - tests/test_accessibility_identity.py
      - https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      - https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2#issuecomment-5552837967
      - https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2#issuecomment-5555569354
    notes: >-
      Current Stable consumer target is 1.1.0. Dev8 accepted the combined
      200%-text plus compact/minimum-width adaptive-layout slice on the
      representative Zorin OS laptop. Dev9 corrected effective HighContrast
      takeover for process-local GTK_THEME overrides. Dev10 then restored
      clearly perceivable keyboard focus while preserving system HighContrast
      palette authority; representative evidence verifies constrained-width
      compact rendering and complete requested forward/reverse keyboard traversal.
      The first AT-SPI semantic probe on dev10 enumerated the running Care process
      as __main__.py instead of GoreeCloud Care, causing product-name discovery to
      fail. Dev11 set the GLib application name before Gtk.Application startup,
      but representative-device AT-SPI revalidation still exposed __main__.py.
      Dev12 additionally sets the GLib program name before application startup,
      retains the human-readable application name, and adds source-level regression
      guards for both identities. Representative-device dev12 AT-SPI revalidation
      now exposes GoreeCloud Care as the application root and a follow-up static
      semantic-tree probe verifies the expected status-bar role, selector/action
      roles, names/descriptions, and live checked/focused state. A first dynamic
      accessible-name listener produced no status events while the session again
      reported a stale/unavailable AT-SPI socket path. Because static reads work and
      Care's set_status() updates the accessible name and emits visible-data-changed,
      dynamic event delivery remains inconclusive pending read-only polling and
      screen-reader announcement verification.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Mesh registration/runtime acceptance has not been implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: The Development specification explicitly excludes an account requirement and remote management; re-evaluate Identity applicability if remote or multi-user capabilities are introduced.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements:
      - The Development utility currently persists no durable user application data requiring backup.
  restore:
    required: true
    requirements:
      - Document irreversible Trash deletion and validate package rollback before Release Candidate consideration.
  export:
    required: false
    requirements:
      - No durable user application data is currently stored for export.
  portability:
    required: true
    requirements:
      - Keep maintenance policy and package state documented and avoid proprietary durable data formats.

external_dependencies:
  - name: python3
    purpose: Native application runtime.
    required: true
    version_constraint: ">=3.10"
  - name: PyGObject GTK 3
    purpose: Native Zorin OS desktop interface.
    required: true
    version_constraint: null
  - name: ATK introspection
    purpose: Native assistive-technology roles, names, descriptions, and status change semantics.
    required: true
    version_constraint: null
  - name: PolicyKit
    purpose: Explicit authorization for APT cache cleanup and Linux file-cache reclaim.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides:
    - goreecloud-care-local-maintenance

evidence:
  acceptance_tests:
    - id: care-dev8-large-text-compact-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2#issuecomment-5552837967
      revision: 45b5f11a49f363ebcaf753c892245a31109bc9bb
      result: passed
      observed_at: "2026-09-05T16:19:00Z"
      notes: Representative Zorin OS laptop accepted the combined GDK_DPI_SCALE=2 large-text and compact/minimum-width adaptive-layout slice; broader accessibility acceptance remains open.
    - id: care-dev9-highcontrast-keyboard-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      revision: 7db8710b113cda314903475cd7c220d57bea94d8
      result: failed
      observed_at: "2026-09-05T20:41:00Z"
      notes: Representative-device screenshot verified system HighContrast palette takeover, but the user reported no visibly perceivable response to Tab; dev10 remediated this defect.
    - id: care-dev10-highcontrast-focus-sampled-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2#issuecomment-5555569354
      revision: 3524a4a82da87ea51dcde08992a402190b54c130
      result: passed
      observed_at: "2026-09-05T23:38:00Z"
      notes: Representative-device dev10 build/install succeeded; HighContrast palette authority, sampled focus, constrained-width compact rendering, and complete requested forward/reverse keyboard traversal are accepted for this slice.
    - id: care-dev10-atspi-application-identity-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      revision: 3524a4a82da87ea51dcde08992a402190b54c130
      result: failed
      observed_at: "2026-09-06T13:04:00Z"
      notes: AT-SPI desktop enumeration succeeded but exposed the running Care application as __main__.py rather than GoreeCloud Care, preventing product-name discovery. Dev11 attempted remediation by setting only the GLib application name.
    - id: care-dev11-atspi-application-identity-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      revision: c5582ab650ab41f76fed396e84851f3507a0e1b9
      result: failed
      observed_at: "2026-09-06T13:26:00Z"
      notes: Representative-device dev11 validation/build/install succeeded, but the AT-SPI application root still appeared as __main__.py. Dev12 additionally sets the GLib program name before Gtk.Application startup and requires target revalidation.
    - id: care-dev12-atspi-application-identity-static-semantics-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      revision: 09c3a6bcbec094dd3cb0c828de88d084fcbd5a22
      result: passed
      observed_at: "2026-09-06T14:14:00Z"
      notes: Representative-device AT-SPI inspection exposes GoreeCloud Care as the application root and verifies the expected status-bar, cleanup-selector, and action-control roles, useful accessible names/descriptions, and live checked/focused states. Dynamic event delivery and screen-reader announcement quality remain open.
    - id: care-dev12-atspi-dynamic-listener-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      revision: 09c3a6bcbec094dd3cb0c828de88d084fcbd5a22
      result: inconclusive
      observed_at: "2026-09-06T14:40:00Z"
      notes: A property-change accessible-name listener produced no Care status events and the session again reported a stale/unavailable AT-SPI socket path. Static AT-SPI reads remain successful and Care set_status() updates the accessible name and emits visible-data-changed, so read-only polling is required to distinguish application semantic mutation from event-subscription transport failure.
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence: []
  blockers:
    - GoreeCloud Care is a component manifest under apps/goreecloud-care; repository-wide monorepo inventory/conformance integration remains incomplete.
    - GoreeCloud Manager integration and acceptance remain incomplete.
    - Privacy Shield formal acceptance remains incomplete.
    - Wardveil Security formal acceptance remains incomplete.
    - Everkeep recovery/rollback acceptance remains incomplete.
    - Final Glaze UI current-Stable native acceptance remains incomplete. Core light-default, status-salience, cancellation, privileged-success, and cleanup functions are representative-device verified through dev5; dev8 closes the combined 200%-text compact adaptive-layout blocker; dev10 closes the HighContrast focus/traversal slice. Dev12 closes AT-SPI application identity and static semantic-tree roles/names/descriptions/state semantics for the representative slice; dynamic event delivery and screen-reader announcement quality remain open.
    - GoreeCloud Mesh registration/runtime acceptance remains incomplete.
    - Package rollback remains unverified.
    - Official GoreeCloud Care application icon/branding remains incomplete.
    - Release Candidate and release evidence are intentionally absent for this Development build.
