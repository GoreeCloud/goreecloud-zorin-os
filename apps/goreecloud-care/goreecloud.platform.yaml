conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - apps/goreecloud-care/GLAZE-UI-CONFORMANCE.md
    - apps/goreecloud-care/GLAZE-UI-V1.4-MIGRATION.md
    - apps/goreecloud-care/goreecloud_care/glaze_v14.py
    - apps/goreecloud-care/goreecloud_care/glaze_v14_global.py
  blockers:
    - Exact 0.2.0-dev1 automated qualification must pass after the new artifact identity split.
    - Glaze UI V1.4 representative rendered/native acceptance is required on Zorin OS 17.3 for the exact candidate.
    - Privacy Shield must independently accept the exact 0.2.0 candidate before production privacy status can be claimed.
    - Wardveil must independently govern the exact 0.2.0 privilege-boundary evidence before protection permission can transfer.
    - Everkeep must independently accept exact 0.2.0 restore/rollback evidence before continuity can become ready.
    - Stable promotion requires a later exact release candidate and cannot be inferred from historical 0.1.0 acceptance.
