schema_version: "0.2"

component:
  type: application
  id: goreecloud-care
  product_name: GoreeCloud Care
  repository: GoreeCloud/goreecloud-zorin-os

lifecycle: release-candidate
version: 0.1.0-dev22

supported_platforms:
  - linux

api:
  versions:
    - "1"
  endpoints:
    - name: maintenance-report
      url: local-cli://goreecloud-care/report
      purpose: Privacy-safe schema-versioned local maintenance snapshot for authorized local consumers.
    - name: health
      url: local-cli://goreecloud-care/health
      purpose: Minimized local readiness and product-version status without telemetry or privileged execution.
    - name: privacy-status
      url: local-cli://goreecloud-care/privacy-status
      purpose: Privacy Shield-shaped local privacy status for the declared Care application adapter.
    - name: security-status
      url: local-cli://goreecloud-care/security-status
      purpose: Wardveil-compatible scoped status for the installed Care privilege boundary.
    - name: continuity-status
      url: local-cli://goreecloud-care/continuity-status
      purpose: Everkeep continuity status for Care package restore and rollback evidence.

