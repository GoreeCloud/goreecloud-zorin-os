      - contracts/privacy-shield.application.json
      - contracts/privacy-shield.adapter.json
      - goreecloud_care/platform_status.py
      - RELEASE-ACCEPTANCE.md
    notes: Stable 0.1.0 has historical Privacy Shield acceptance, but the 0.2.0-dev1 source/package identity requires fresh runtime/production acceptance. Local source evidence intentionally fails closed and cannot self-promote that external governance decision.
  wardveil_security:
    result: applicable-nonconformant
    version: null
    evidence:
      - SECURITY.md
      - WARDVEIL-INTEGRATION.md
      - goreecloud_care/platform_status.py
      - packaging/goreecloud-care-helper
      - packaging/com.goreecloud.care.policy
      - tests/test_helper.py
      - tests/test_privilege.py
      - RELEASE-ACCEPTANCE.md
    notes: Stable 0.1.0 has historical scoped Wardveil acceptance. The new 0.2.0-dev1 package must independently prove and obtain governance for the local-maintenance-privilege-boundary before any Wardveil protection claim transfers.
  everkeep:
    result: applicable-nonconformant
    version: null
    evidence:
      - RECOVERY.md
      - RELEASE-ACCEPTANCE.md
      - contracts/everkeep.adoption.json
      - contracts/everkeep.acceptance.json
      - goreecloud_care/platform_status.py
      - scripts/validate-package-lifecycle.sh
      - scripts/run-representative-acceptance.sh
    notes: Historical 0.1.0 recovery readiness is exact-build scoped. 0.2.0-dev1 requires new package lifecycle, representative-target, exact package SHA, and separate Everkeep promotion evidence.
  glaze_ui:
    result: applicable-nonconformant
    version: "1.4.0"
    evidence:
      - GLAZE-UI-CONFORMANCE.md
      - GLAZE-UI-V1.4-MIGRATION.md
      - BRANDING.md
      - goreecloud_care/glaze_v14.py
      - goreecloud_care/glaze_v14_global.py
      - goreecloud_care/glaze_v13.py
      - tests/test_glaze_v14_contract.py
      - tests/test_ui_contract.py
      - tests/test_focus_resilience.py
      - tests/test_accessibility_identity.py
      - tests/runtime_ui_acceptance.py
      - https://github.com/GoreeCloud/goreecloud-glaze-ui/commit/01c86323f8b747373d308026adc8b0881855cdc5
    notes: GoreeCloud Care 0.2.0-dev1 intentionally targets Glaze UI V1.4 / 1.4.0. Platform Contract 0.3 permits a Development component to declare that forward target without treating it as Stable acceptance. The design-system release and automated implementation evidence do not independently grant downstream Care conformance; exact representative rendered/native and consumer acceptance remain required.
  mesh:
    result: not-applicable-justified
    version: null
    evidence: [API.md, CAPABILITIES.md, goreecloud_care/platform_status.py]
    notes: Current Care has no cross-application coordination, service discovery, Mesh event transport, or Mesh policy authority.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence: [SPECIFICATIONS.md, API.md]
    notes: Current Care has no GoreeCloud account, remote management, multi-user behavior, or delegated administration.
  sync:
    result: not-applicable-justified
    version: null
    evidence: [SPECIFICATIONS.md, API.md, PRIVACY.md]
    notes: Current Care owns no cross-device synchronized dataset or remote state. Maintenance scans, reports, and status are local-first and device-scoped.

health:
  health_endpoint: local-cli://goreecloud-care/health
  readiness_endpoint: local-cli://goreecloud-care/health

continuity:
  backup:
    required: false
    requirements:
      - Care persists no substantial durable user application data requiring an application-owned backup workflow; continuity is exact package/source recovery evidence.
  restore:
    required: true
    requirements:
      - The exact 0.2.0-dev1 / 0.2.0~dev1 candidate must pass install, remove/reinstall, downgrade, restore, final installed validation, provenance, and representative-target handoff before release promotion.
      - Historical Stable 0.1.0 recovery evidence remains audit/rollback context and does not accept the new candidate.
      - Permanent Trash deletion is irreversible maintenance behavior and is not represented as recoverable application data.
  export:
    required: false
    requirements:
      - Care has no durable user application dataset requiring application-data export/import; read-only reports/status are available.
  portability:
    required: true
    requirements:
      - Report and local API schemas/versioning remain explicit and machine-readable.
      - Package policy, recovery, migration, rollback, and exact provenance remain documented without proprietary durable data formats.

external_dependencies:
  - name: python3
    purpose: Native application runtime, reports, local platform status, and Maintenance Insights.
    required: true
    version_constraint: ">=3.10"
  - name: PyGObject GTK 3
    purpose: Native Zorin OS desktop interface and Maintenance Insights.
    required: true
    version_constraint: null
  - name: ATK introspection
    purpose: Assistive-technology roles, names, descriptions, and status semantics.
    required: true
    version_constraint: null
  - name: PolicyKit
    purpose: Explicit authorization for APT cleanup and Linux file-cache reclaim.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.3"
  glaze_ui_required: "1.4.0"
  requires: [goreecloud-platform-contract==0.3, glaze-ui==1.4.0]
  provides:
    - goreecloud-care-local-maintenance
    - goreecloud-care-read-only-maintenance-report
    - goreecloud-care-read-only-maintenance-insights
    - goreecloud-care-local-status-api-v1

