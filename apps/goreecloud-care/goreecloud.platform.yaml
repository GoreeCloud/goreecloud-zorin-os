  manager:
    result: not-applicable-justified
    version: null
    evidence: [API.md, CAPABILITIES.md, goreecloud_care/platform_status.py]
    notes: The current local single-user Care scope has no central, remote, or delegated administration.
  privacy_shield:
    result: applicable-nonconformant
    version: null
    evidence:
