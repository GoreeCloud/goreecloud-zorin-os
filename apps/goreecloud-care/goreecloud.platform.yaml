schema_version: "0.2"

component:
  type: application
  id: goreecloud-care
  product_name: GoreeCloud Care
  repository: GoreeCloud/goreecloud-zorin-os

lifecycle: development
version: 0.1.0-dev8

supported_platforms:
  - linux

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Operational visibility requirements have not yet been integrated or accepted.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - PRIVACY.md
    notes: Local-only privacy design is documented; formal Privacy Shield acceptance is not claimed.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
    notes: Least-privilege source controls are present; formal Wardveil Security acceptance is not claimed.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - RECOVERY.md
    notes: Recovery behavior is documented; Everkeep recovery acceptance has not been completed.
  glaze_ui:
    result: applicable-blocked
    version: "1.1.0"
    evidence: []
    notes: Current Stable consumer target is 1.1.0. Dev6 preserved representative-device-verified light appearance, focus, semantic status treatment, maintenance workflows, and normal-text compact composition. Dev7 passed exact-head CI and representative-device source/package validation but direct GDK_DPI_SCALE=2 rendering proved its raw 820-pixel breakpoint still failed to enter compact mode at the narrowest reachable large-text window. Dev8 evaluates the same compact contract against a GDK_DPI_SCALE-adjusted effective width. Target dev8 rendering, HighContrast, assistive-technology, resilience, and final application conformance acceptance remain incomplete.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Mesh registration/runtime acceptance has not been implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: The Development specification explicitly excludes an account requirement and remote management; re-evaluate Identity applicability if remote or multi-user capabilities are introduced.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements:
      - The Development utility currently persists no durable user application data requiring backup.
  restore:
    required: true
    requirements:
      - Document irreversible Trash deletion and validate package rollback before Release Candidate consideration.
  export:
    required: false
    requirements:
      - No durable user application data is currently stored for export.
  portability:
    required: true
    requirements:
      - Keep maintenance policy and package state documented and avoid proprietary durable data formats.

external_dependencies:
  - name: python3
    purpose: Native application runtime.
    required: true
    version_constraint: ">=3.10"
  - name: PyGObject GTK 3
    purpose: Native Zorin OS desktop interface.
    required: true
    version_constraint: null
  - name: ATK introspection
    purpose: Native assistive-technology roles, names, descriptions, and status change semantics.
    required: true
    version_constraint: null
  - name: PolicyKit
    purpose: Explicit authorization for APT cache cleanup and Linux file-cache reclaim.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides:
    - goreecloud-care-local-maintenance

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence: []
  blockers:
    - GoreeCloud Care is a component manifest under apps/goreecloud-care; repository-wide monorepo inventory/conformance integration remains incomplete.
    - GoreeCloud Manager integration and acceptance remain incomplete.
    - Privacy Shield formal acceptance remains incomplete.
    - Wardveil Security formal acceptance remains incomplete.
    - Everkeep recovery/rollback acceptance remains incomplete.
    - Final Glaze UI current-Stable native acceptance remains incomplete. Core light-default, status-salience, keyboard-focus, cancellation, privileged-success, and all present cleanup functions are representative-device verified through dev5; dev6 normal-text compact behavior is target-verified; dev7 combined 200%-text compact behavior failed on target despite green source/package validation; dev8 effective-width remediation still requires exact-head repository validation and target-device acceptance, followed by HighContrast and assistive-technology evidence.
    - GoreeCloud Mesh registration/runtime acceptance remains incomplete.
    - Package rollback remains unverified.
    - Official GoreeCloud Care application icon/branding remains incomplete.
    - Release Candidate and release evidence are intentionally absent for this Development build.
