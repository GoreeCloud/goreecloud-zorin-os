schema_version: "0.2"

component:
  type: application
  id: goreecloud-care
  product_name: GoreeCloud Care
  repository: GoreeCloud/goreecloud-zorin-os

lifecycle: development
version: 0.1.0-dev10

supported_platforms:
  - linux

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Operational visibility requirements have not yet been integrated or accepted.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - PRIVACY.md
    notes: Local-only privacy design is documented; formal Privacy Shield acceptance is not claimed.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
    notes: Least-privilege source controls are present; formal Wardveil Security acceptance is not claimed.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - RECOVERY.md
    notes: Recovery behavior is documented; Everkeep recovery acceptance has not been completed.
  glaze_ui:
    result: applicable-blocked
    version: "1.1.0"
    evidence:
      - tests/test_ui_contract.py
      - tests/test_focus_resilience.py
      - https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      - https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2#issuecomment-5552837967
    notes: >-
      Current Stable consumer target is 1.1.0. Dev8 accepted the combined
      200%-text plus compact/minimum-width adaptive-layout slice on the
      representative Zorin OS laptop. The first HighContrast pass showed visible
      focus but failed system palette takeover. Dev9 corrected effective
      HighContrast detection for process-local GTK_THEME overrides, and fresh
      target evidence now shows the system HighContrast presentation replacing
      Care's light Development palette. In that same dev9 state, pressing Tab
      produces no visibly perceivable focus response. This blocks keyboard-under-
      resilience acceptance and is not treated as proof that logical traversal
      itself is absent. Dev10 adds a separate focus-only GTK provider beneath
      Care's normal application CSS. It uses the active GTK theme foreground
      color and defines no application palette surfaces, so normal Care focus
      styling remains authoritative in ordinary mode while HighContrast keeps a
      visible focus fallback after the normal palette provider is suppressed.
      Dev10 remains target-unverified. Assistive-technology, broader appearance/
      resilience, and final application conformance acceptance remain incomplete.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Mesh registration/runtime acceptance has not been implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: The Development specification explicitly excludes an account requirement and remote management; re-evaluate Identity applicability if remote or multi-user capabilities are introduced.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements:
      - The Development utility currently persists no durable user application data requiring backup.
  restore:
    required: true
    requirements:
      - Document irreversible Trash deletion and validate package rollback before Release Candidate consideration.
  export:
    required: false
    requirements:
      - No durable user application data is currently stored for export.
  portability:
    required: true
    requirements:
      - Keep maintenance policy and package state documented and avoid proprietary durable data formats.

external_dependencies:
  - name: python3
    purpose: Native application runtime.
    required: true
    version_constraint: ">=3.10"
  - name: PyGObject GTK 3
    purpose: Native Zorin OS desktop interface.
    required: true
    version_constraint: null
  - name: ATK introspection
    purpose: Native assistive-technology roles, names, descriptions, and status change semantics.
    required: true
    version_constraint: null
  - name: PolicyKit
    purpose: Explicit authorization for APT cache cleanup and Linux file-cache reclaim.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides:
    - goreecloud-care-local-maintenance

evidence:
  acceptance_tests:
    - id: care-dev8-large-text-compact-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2#issuecomment-5552837967
      revision: 45b5f11a49f363ebcaf753c892245a31109bc9bb
      result: passed
      observed_at: "2026-09-05T16:19:00Z"
      notes: Representative Zorin OS laptop accepted the combined GDK_DPI_SCALE=2 large-text and compact/minimum-width adaptive-layout slice; broader accessibility acceptance remains open.
    - id: care-dev9-highcontrast-keyboard-target
      category: accessibility
      path: https://github.com/GoreeCloud/goreecloud-zorin-os/pull/2
      revision: 7db8710b113cda314903475cd7c220d57bea94d8
      result: failed
      observed_at: "2026-09-05T20:41:00Z"
      notes: Representative-device screenshot verifies system HighContrast palette takeover, but the user reports no visibly perceivable response to Tab; dev10 focus-resilience remediation requires target revalidation.
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence: []
  blockers:
    - GoreeCloud Care is a component manifest under apps/goreecloud-care; repository-wide monorepo inventory/conformance integration remains incomplete.
    - GoreeCloud Manager integration and acceptance remain incomplete.
    - Privacy Shield formal acceptance remains incomplete.
    - Wardveil Security formal acceptance remains incomplete.
    - Everkeep recovery/rollback acceptance remains incomplete.
    - Final Glaze UI current-Stable native acceptance remains incomplete. Core light-default, status-salience, cancellation, privileged-success, and current cleanup functions are representative-device verified through dev5; dev6 normal-text compact behavior is target-verified; dev8 closes the combined 200%-text compact adaptive-layout blocker. Dev9 target evidence verifies HighContrast palette takeover but fails visible keyboard-focus behavior under that resilience mode. Dev10 contains a source remediation using a theme-derived focus-only provider and remains target-unverified. Full keyboard-under-resilience, assistive-technology, broader appearance/resilience, and final current-Stable consumer acceptance remain open.
    - GoreeCloud Mesh registration/runtime acceptance remains incomplete.
    - Package rollback remains unverified.
    - Official GoreeCloud Care application icon/branding remains incomplete.
    - Release Candidate and release evidence are intentionally absent for this Development build.
